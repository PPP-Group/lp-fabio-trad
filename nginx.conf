server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O erro "Expected a JavaScript-or-Wasm module script but the server responded
  # with a MIME type of ''" aparece quando o servidor devolve o arquivo sem
  # Content-Type. Estas duas linhas são o que impede isso: a tabela oficial de
  # tipos do nginx (que já cobre js, mjs, css, webp, svg, woff2 e json) e um
  # padrão para o que não estiver nela.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # O site fica atrás do proxy do Easypanel, na rede interna do Docker: o IP
  # real do visitante chega no cabeçalho.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Os arquivos de /assets/ levam hash no nome: podem ficar no cache para
  # sempre, porque conteúdo novo vira nome novo. O =404 é proposital — sem ele,
  # um bundle que faltasse voltaria como index.html e o navegador acusaria
  # justamente o erro de MIME.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Os arquivos com hash do painel. Ele os pede em /static/ na raiz — não há
  # como mudar isso no build dele — e o site nunca usa esse caminho.
  location /static/ {
    alias /usr/share/nginx/html/studio/static/;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # São duas aplicações aqui dentro, cada uma com o seu ponto de entrada. Sem
  # esta regra, uma rota interna do painel cairia no index.html do site e o
  # editor veria a landing page no lugar do formulário.
  location /studio {
    try_files $uri $uri/ /studio/index.html;
  }

  # Imagens e ícones de public/ têm nome fixo: cache curto, para que uma troca
  # de foto apareça sem o visitante precisar limpar o navegador.
  location ~* \.(webp|jpg|jpeg|png|svg|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # O index.html nunca fica em cache: é ele que aponta para o bundle novo.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Página única: qualquer rota desconhecida devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
